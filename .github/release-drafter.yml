name-template: 'v$RESOLVED_VERSION 🌈'
tag-template: 'v$RESOLVED_VERSION'
categories:
  - title: '💥 Breaking Changes'
    label: '💥 Breaking Change'

  - title: '🌟 New Features'
    label: '🌟 New Feature'

  - title: '⭐ Features'
    label: '⭐ Feature'

  - title: '🐞 Bug Fixes'
    label: '🐞 Bug Fix'

  - title: '🛠 Improvements'
    label: '🛠 Improvement'

  - title: '🌀 External Changes'
    label: '🔌 3rd Party Plugin'

  - title: '📖 Documentation'
    label: '📖 Docs'

  - title: '🌍 Localization'
    label: '🌍 i18n'

change-template: '- $TITLE (#$NUMBER) @$AUTHOR'
no-changes-template: '- No changes'
template: |
  $CHANGES

  ***

  For full changes, see the [comparison between $PREVIOUS_TAG and v$NEXT_MINOR_VERSION]($REPOSITORY/compare/$PREVIOUS_TAG...v$NEXT_MINOR_VERSION)

exclude-labels:
  - 'Skip Release'
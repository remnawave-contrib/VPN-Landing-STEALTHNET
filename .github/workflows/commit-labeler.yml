name: Label PR by commits

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Label by commit messages
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;

            const commits = await github.paginate(
              github.rest.pulls.listCommits,
              { owner, repo, pull_number: pr.number }
            );

            const labels = new Set();

            for (const c of commits) {
              const msg = c.commit.message;

              if (/BREAKING CHANGE|!:/.test(msg)) {
                labels.add('💥 Breaking Change');
              }
              if (/^feat(\(.+\))?:/m.test(msg)) {
                labels.add('⭐ Feature');
              }
              if (/^fix(\(.+\))?:/m.test(msg)) {
                labels.add('🐞 Bug Fix');
              }
              if (/^(chore|refactor|style|test|ci)(\(.+\))?:/m.test(msg)) {
                labels.add('🛠 Improvement');
              }
              if (/^docs(\(.+\))?:/m.test(msg)) {
                labels.add('📖 Docs');
              }
              if (/^i18n(\(.+\))?:/m.test(msg)) {
                labels.add('🌍 i18n');
              }
            }

            if (labels.size > 0) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: pr.number,
                labels: [...labels],
              });
            }